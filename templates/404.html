{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found - Rameshwaram Cruise Varanasi{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle mb-4" style="width: 120px; height: 120px;">
                    <i class="fas fa-compass fa-4x text-primary animate-spin-slow"></i>
                </div>
            </div>
            <h1 class="display-3 fw-black text-secondary mb-2" style="font-family: 'Montserrat', sans-serif;">404</h1>
            <h4 class="fw-bold text-dark mb-4">This page does not exist</h4>
            
            <p class="text-muted mb-5 px-3" style="font-size: 1.15rem; line-height: 1.6;">
                Sign in to see your ticket or go to home. This page does not exist.
            </p>
            
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center px-4">
                <a href="{% url 'customer_login' %}" class="btn btn-primary btn-lg py-3 px-4 fw-bold rounded-3 shadow">
                    <i class="fas fa-user-lock me-2"></i> Sign In to See Your Ticket
                </a>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg py-3 px-4 fw-bold rounded-3">
                    <i class="fas fa-home me-2"></i> Go to Home
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
        animation: spinSlow 12s linear infinite;
    }
</style>
{% endblock %}
